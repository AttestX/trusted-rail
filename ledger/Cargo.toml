[package]
name = "trusted-rail-ledger"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Durable authorization state for trusted-rail: policies, state roots and the decision chain"

# Not a member of the engine's package: storage must never reach the proof guest.
[workspace]

[dependencies]
trusted-rail = { path = ".." }
trusted-contracts = { git = "https://github.com/attestx/trusted-data-router", rev = "5aa93d4be778cf84714954c6d9f28631524610f7" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = "1"
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
hex = "0.4"

[profile.dev]
debug = 0
