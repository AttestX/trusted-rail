[package]
name = "trusted-rail"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rule evaluation and authorization contracts for BotMesh runtimes"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regorus = { git = "https://github.com/attestx/regorus", rev = "1bbb3e6798c85e4b30b298fad9b8fc207e8480cc", version = "=0.15.0", default-features = false, features = ["no_std"] }
sha2 = "0.10"
hex = "0.4"
trusted-contracts = { git = "https://github.com/BotMesh/trusted-data-router", rev = "5aa93d4be778cf84714954c6d9f28631524610f7" }

[profile.dev]
debug = 0
