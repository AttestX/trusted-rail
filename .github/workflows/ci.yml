name: Rust checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --features serde_json/preserve_order,serde_json/unbounded_depth
      - run: python3 -O -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/check_engine_features.py
      - run: cargo fmt --manifest-path guest/Cargo.toml -- --check
      - run: cargo fmt --manifest-path guest-check/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path guest-check/Cargo.toml
      - run: python3 scripts/check_engine_features.py guest/Cargo.toml
      - run: python3 scripts/check_engine_features.py guest-check/Cargo.toml
      - run: cargo fmt --manifest-path ledger/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path ledger/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path ledger/Cargo.toml
      - run: python3 scripts/check_engine_features.py ledger/Cargo.toml
      - run: cargo fmt --manifest-path enforce/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path enforce/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path enforce/Cargo.toml
      - run: python3 scripts/check_engine_features.py enforce/Cargo.toml
